# Encoder ablation: PTv3 in place of Utonia, trained during pretraining.
# The first four encoder stages of the upstream module's default layout, on a 1 cm grid, so that a token covers 8 cm.
# Needs Point Transformer V3: clone https://github.com/Pointcept/PointTransformerV3, check out 3229e9b, and put
# the folder that holds the clone on PYTHONPATH, so that `PointTransformerV3.model` imports.
defaults:
  - steertuning
  - _self_

point_encoder: ptv3
point_feature_dim: 259      # final stage 256 + xyz 3
point_encoder_args:
  grid_size: 0.01           # meters
  in_channels: 9            # xyz, rgb, normals (zero)
  order: [z, z-trans, hilbert, hilbert-trans]
  stride: [2, 2, 2]
  enc_depths: [2, 2, 2, 6]
  enc_channels: [32, 64, 128, 256]
  enc_num_head: [2, 4, 8, 16]
  enc_patch_size: [1024, 1024, 1024, 1024]
  mlp_ratio: 4
  drop_path: 0.3
  shuffle_orders: true
