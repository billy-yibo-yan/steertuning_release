name: checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: ruff check src scripts examples
      - run: ruff format --check src scripts examples
      # E1121 is a call with too many arguments.
      - run: pylint --disable=all --enable=E1121 src scripts
      - run: python examples/quickstart.py
