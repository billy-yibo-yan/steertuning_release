[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steertuning"
version = "1.0.0"
description = "Official code for Steertuning Policies from a Few Human Videos"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "The Steertuning Authors" }]
dependencies = [
    "diffusers==0.36.0",
    "hydra-core==1.3.2",
    "numpy==2.4.4",
    "omegaconf==2.3.0",
    "opencv-python-headless==4.13.0.92",
    "pillow==12.0.0",
    "pydantic==2.12.5",
    "pyyaml==6.0.3",
    "safetensors==0.7.0",
    "scipy==1.17.1",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
# Utonia, SAM3, S2M2, aria2mano and wuji-retargeting install from git, see the README.
training = [
    "accelerate==1.12.0",
    "addict==2.4.0",
    "protobuf==6.33.6",
    "sentencepiece==0.2.1",
    "timm==1.0.24",
    "transformers==4.57.1",
    "wandb==0.25.0",
]
processing = [
    "accelerate==1.12.0",
    "bitsandbytes==0.49.2",
    "commlink==0.4.2",
    "einops==0.8.2",
    "google-genai==1.68.0",
    "open3d==0.19.0",
    "projectaria-tools==2.1.0",
    "pycocotools==2.0.11",
    "rich==14.2.0",
    "sentencepiece==0.2.1",
    "transformers==4.57.1",
    "triton==3.4.0",
]
recording = [
    "commlink==0.4.2",
]
# The workstation's packages for deployment.
robot = [
    "accelerate==1.12.0",
    "commlink==0.4.2",
    "mink==1.1.0",
    "mujoco==3.5.0",
    "protobuf==6.33.6",
    "pyzmq==27.1.0",
    "sentencepiece==0.2.1",
    "transformers==4.57.1",
]
navigation = [
    "commlink==0.4.2",
    "google-genai==1.68.0",
    "pyzmq==27.1.0",
]
dev = [
    "pylint==4.1.3",
    "ruff==0.16.5",
]

[project.urls]
Homepage = "https://steertuning.github.io"
Paper = "https://arxiv.org/abs/2610.18711"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "T100"]

[tool.ruff.lint.isort]
known-first-party = ["steertuning"]

[tool.ruff.lint.per-file-ignores]
# Model prompts stay on one line each.
"src/steertuning/processing/language.py" = ["E501"]
"src/steertuning/processing/object_grounding.py" = ["E501"]
